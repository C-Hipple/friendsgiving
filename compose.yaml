services:
  brogiving:
    build: .
    image: brogiving:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      SITE_PASSWORD: ${SITE_PASSWORD:?set SITE_PASSWORD in .env}
      EVENT_NAME: ${EVENT_NAME:-Brogiving 2026}
      EVENT_DATE: ${EVENT_DATE:-TBD}
      EVENT_TIME: ${EVENT_TIME:-TBD}
      EVENT_LOCATION: ${EVENT_LOCATION:-TBD}
      EVENT_ADDRESS: ${EVENT_ADDRESS:-}
      TZ: ${TZ:-UTC}
    volumes:
      - brogiving-data:/data

volumes:
  brogiving-data:
